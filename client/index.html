<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ostatnia Szychta</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>Ostatnia Szychta</h1>
      <span id="connection-status">disconnected</span>
    </header>

    <main id="app-main">
      <section id="chat-panel" aria-label="Conversation">
        <div id="chat-log" role="log" aria-live="polite"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="Type a command..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>

      <section id="room-panel" aria-label="Room view">
        <div id="room-panel-toolbar">
          <button id="expand-button" type="button" disabled>Expand</button>
        </div>
        <div id="room-frame-container">
          <p id="room-frame-placeholder">Room view not connected yet.</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
